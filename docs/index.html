<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VCAT–1T1C DRAM TCAD 공동 연구 Run Sheet 대시보드">
  <title>VCAT–1T1C DRAM TCAD Run Sheet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="team.css">
  <link rel="stylesheet" href="task-output-presence.css">
  <link rel="stylesheet" href="research-state-ui.css">
  <link rel="stylesheet" href="table-submission.css">
  <link rel="stylesheet" href="submission-delete.css">
  <link rel="stylesheet" href="submission-viewer.css">
  <link rel="stylesheet" href="submission-viewer-polish.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div>
        <p class="eyebrow">VCAT–1T1C DRAM TCAD</p>
        <h1>Research Dashboard</h1>
      </div>
      <div class="header-meta">
        <button id="auth-button" class="btn btn--small" type="button">GitHub 로그인</button>
        <span id="auth-user" class="auth-user" hidden></span>
        <small id="last-updated">상태 불러오는 중</small>
      </div>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="진행 상태 요약">
      <article><span>전체 단계</span><strong id="count-all">9</strong></article>
      <article><span>진행 중</span><strong id="count-progress">0</strong></article>
      <article><span>검토·완료</span><strong id="count-review">0</strong></article>
      <article><span>대기·잠금</span><strong id="count-waiting">9</strong></article>
    </section>

    <section class="overall-panel" aria-label="전체 진행률">
      <div class="overall-panel__top">
        <strong>전체 진행률</strong>
        <span id="overall-progress">0%</span>
      </div>
      <div class="progress progress--large">
        <span id="overall-progress-bar" style="width:0%"></span>
      </div>
    </section>

    <section class="team-section" aria-labelledby="team-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">RESEARCH TEAM</p>
          <h2 id="team-title">공동 연구원</h2>
        </div>
        <a class="btn btn--small" href="https://github.com/jujushmaterial/VCAT-1T1C-DRAM-TCAD-Research/tree/main/members" target="_blank" rel="noreferrer">전체 개인 폴더</a>
      </div>
      <div id="team-grid" class="team-grid" aria-live="polite"></div>
    </section>

    <section class="toolbar" aria-label="단계 필터">
      <h2>연구 단계</h2>
      <div class="filters" role="group" aria-label="상태 필터">
        <button class="filter is-active" data-filter="all">전체</button>
        <button class="filter" data-filter="in-progress">진행 중</button>
        <button class="filter" data-filter="review">검토</button>
        <button class="filter" data-filter="completed">완료</button>
        <button class="filter" data-filter="waiting">대기</button>
        <button class="filter" data-filter="locked">잠금</button>
      </div>
    </section>

    <section id="phase-grid" class="phase-grid" aria-live="polite"></section>
  </main>

  <dialog id="phase-dialog" class="phase-dialog">
    <button id="dialog-close" class="dialog-close" aria-label="닫기" type="button">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <dialog id="submission-dialog" class="phase-dialog submission-dialog">
    <button id="submission-close-x" class="dialog-close" aria-label="닫기" type="button">×</button>
    <div id="submission-content"></div>
  </dialog>

  <dialog id="submission-viewer-dialog" aria-labelledby="submission-viewer-title">
    <div id="submission-viewer-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer>
    <span>VCAT–1T1C DRAM TCAD Research</span>
    <a href="https://github.com/jujushmaterial/VCAT-1T1C-DRAM-TCAD-Research" target="_blank" rel="noreferrer">GitHub 저장소</a>
  </footer>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
  <script src="task-output-presence.js" defer></script>
  <script src="table-submission.js" defer></script>
  <script src="research-state-ui.js" defer></script>
  <script src="submission-delete.js" defer></script>
  <script src="submission-viewer.js" defer></script>
  <script src="submission-viewer-polish.js" defer></script>
</body>
</html>
