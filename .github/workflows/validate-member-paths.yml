name: Validate member paths

on:
  pull_request:
    paths:
      - "members/**"
      - "docs/data/members.json"
      - "scripts/validate_member_paths.py"
      - ".github/workflows/validate-member-paths.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-member-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate folder ownership and timeline
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/validate_member_paths.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD
