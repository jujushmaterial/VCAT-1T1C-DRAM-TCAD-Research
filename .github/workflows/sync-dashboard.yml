name: Sync research dashboard

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_dashboard.py"
      - "docs/data/phases.json"
      - ".github/workflows/sync-dashboard.yml"

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-research-dashboard
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync_dashboard.py

      - name: Commit updated status
        run: |
          if git diff --quiet -- docs/data/status.json; then
            echo "No dashboard status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/status.json
          git commit -m "Sync dashboard status from run sheet issues"
          git push
