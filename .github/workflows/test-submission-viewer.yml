name: Test submission viewer

on:
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/submission-viewer.js"
      - "docs/submission-viewer.css"
      - "worker/src/v8.js"
      - "worker/wrangler.toml"
      - "worker/README.md"
      - "tests/test_submission_viewer.py"
      - "tests/test_submission_viewer_worker.mjs"
      - ".github/workflows/test-submission-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check docs/submission-viewer.js
          node --check worker/src/v8.js
      - name: Worker helper tests
        run: node tests/test_submission_viewer_worker.mjs
      - name: Dashboard contract tests
        run: python -m unittest discover -s tests -p "test_submission_viewer.py" -v
