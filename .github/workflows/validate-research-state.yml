name: Validate research state

on:
  pull_request:
    paths:
      - "scripts/research_state.py"
      - "scripts/research_state_core.py"
      - "scripts/research_state_integrity.py"
      - "scripts/sync_dashboard.py"
      - "scripts/sync_dashboard_v5.py"
      - "tests/test_research_state*.py"
      - "docs/data/submissions.json"
      - "docs/data/completion-policy.json"
      - "docs/data/submission-classifications.json"
      - ".github/workflows/sync-dashboard.yml"
      - ".github/workflows/validate-research-state.yml"
  push:
    branches: [main]
    paths:
      - "scripts/research_state.py"
      - "scripts/research_state_core.py"
      - "scripts/research_state_integrity.py"
      - "scripts/sync_dashboard.py"
      - "scripts/sync_dashboard_v5.py"
      - "tests/test_research_state*.py"
      - "docs/data/submissions.json"
      - "docs/data/completion-policy.json"
      - "docs/data/submission-classifications.json"
      - ".github/workflows/sync-dashboard.yml"
      - ".github/workflows/validate-research-state.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_research_state*.py" -v

      - name: Validate current repository state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/research_state.py check
