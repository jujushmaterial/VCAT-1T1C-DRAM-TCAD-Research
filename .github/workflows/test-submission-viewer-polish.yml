name: Test submission viewer portfolio polish

on:
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/submission-viewer.css"
      - "docs/submission-viewer-polish.css"
      - "docs/submission-viewer-polish.js"
      - "tests/test_submission_viewer_polish.py"
      - ".github/workflows/test-submission-viewer-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check docs/submission-viewer-polish.js

      - name: Portfolio parity contracts
        run: python -m unittest tests/test_submission_viewer_polish.py -v
