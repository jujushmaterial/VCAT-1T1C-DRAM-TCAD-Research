name: Test output status dots

on:
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/output-status-dots.js"
      - "docs/output-status-dots.css"
      - "tests/test_output_status_dots.mjs"
      - ".github/workflows/test-output-status-dots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: output-status-dots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check docs/output-status-dots.js

      - name: Status dot behavior
        run: node tests/test_output_status_dots.mjs
