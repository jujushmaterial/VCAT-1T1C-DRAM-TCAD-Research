name: Allow registered member submissions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/allow-member-submissions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Allow every registered researcher to submit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = '''function assertSubmissionPermission(issue, session, env) {
            // Phase assignees manage responsibility; submission access is validated by resolveMember.
            return true;
          }
          '''

          pattern = re.compile(
              r'function assertSubmissionPermission\(issue, session, env\) \{[\s\S]*?\n\}\n\n(?=async function resolveMember)'
          )

          for relative in ('worker/src/v4.js', 'worker/src/v5.js'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(replacement + '\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{relative}: permission function replacement count={count}')
              path.write_text(updated, encoding='utf-8')
          PY

          node --check worker/src/v4.js
          node --check worker/src/v5.js
          grep -n "submission access is validated by resolveMember" worker/src/v4.js worker/src/v5.js

      - name: Commit permission update and remove temporary workflow
        run: |
          rm .github/workflows/allow-member-submissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/v4.js worker/src/v5.js .github/workflows/allow-member-submissions.yml
          git commit -m "Allow all registered researchers to submit outputs"
          git push
